services:
  proxy:
    image: nginx:alpine
    container_name: nginx-security-proxy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: nginx:alpine
    container_name: nginx-security-backend
    restart: unless-stopped